<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{% block title %}MatRox Residence{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e4e2e2",
                        "surface": "#fbf9f8",
                        "surface-container": "#efeded",
                        "on-secondary-fixed": "#022100",
                        "outline": "#8a7266",
                        "on-primary-container": "#5a2500",
                        "inverse-surface": "#303031",
                        "on-secondary-container": "#227213",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#095300",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#763300",
                        "secondary-fixed-dim": "#88da70",
                        "primary": "#9b4500",
                        "surface-dim": "#dbdad9",
                        "surface-bright": "#fbf9f8",
                        "surface-container-low": "#f5f3f3",
                        "inverse-primary": "#ffb68e",
                        "inverse-on-surface": "#f2f0f0",
                        "on-primary": "#ffffff",
                        "secondary": "#1d6d0e",
                        "secondary-fixed": "#a3f789",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "primary-container": "#f47c2c",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#331200",
                        "on-tertiary-fixed": "#001945",
                        "primary-fixed": "#ffdbca",
                        "tertiary": "#375ca8",
                        "tertiary-container": "#7a9cec",
                        "on-tertiary-container": "#003177",
                        "background": "#fbf9f8",
                        "tertiary-fixed-dim": "#b0c6ff",
                        "secondary-container": "#a0f487",
                        "primary-fixed-dim": "#ffb68e",
                        "on-tertiary-fixed-variant": "#1a438e",
                        "outline-variant": "#dec1b2",
                        "tertiary-fixed": "#d9e2ff",
                        "on-background": "#1b1c1c",
                        "surface-container-highest": "#e4e2e2",
                        "surface-container-high": "#e9e8e7",
                        "on-surface-variant": "#574237",
                        "surface-tint": "#9b4500",
                        "on-error": "#ffffff",
                        "on-surface": "#1b1c1c"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"}
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-nav {
            background: rgba(251, 249, 248, 0.7);
            backdrop-filter: blur(24px);
        }
        .hero-gradient {
            background: linear-gradient(to bottom, rgba(27, 28, 28, 0.4), rgba(27, 28, 28, 0.1));
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface font-body text-on-surface">
    {% include "includes/navbar.html" %}
    <main>
        {% block content %}{% endblock %}
    </main>
    {% include "includes/footer.html" %}
</body>
</html>
